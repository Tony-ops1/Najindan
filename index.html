.bookmark-layout{display:grid;grid-template-columns:minmax(235px,310px) minmax(0,1fr);gap:18px;align-items:start}

und:#fcf7ef;border:1px solid #eadfce;border-radius:14px;color:#7e6c59;font-size:12px;line-height:1.65}

<body>
<div class="shell">
  <aside class="sidebar">
    <div class="brand"><div class="brand-mark" id="brandIcon"></div><div><div class="brand-name">NajinDan</div><div class="brand-sub">Najin posebni dan</div></div></div>
    <div class="menu-label">ORGANIZACIJA</div>
    <nav class="nav" id="nav" aria-label="Glavni meni"></nav>
    <div class="sidebar-end"><div class="sidebar-note"><div id="sideHeart"></div><h4>Vsak detajl šteje.</h4><p>Vse ideje, obveznosti in želje za vajin dan na enem mestu.</p></div><div class="sidebar-footer">Z ljubeznijo ustvarjen načrtovalnik ♡</div></div>
  </aside>
  <main class="main" id="app" aria-live="polite"></main>
</div>
<dialog class="modal" id="modal" aria-labelledby="modalTitle">

    <div class="modal-head"><h3 id="modalTitle">Dodaj</h3><button type="button" data-close aria-label="Zapri" id="modalClose"></button></div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<input class="import-file" id="importFile" type="file" accept="application/json,.json" aria-label="Uvozi varnostno kopijo">
<script>
(()=>{'use strict';
const ICONS={heart:'<path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8l1.1 1.1L12 21l7.8-7.5 1.1-1.1a5.5 5.5 0 0 0-.1-7.8Z"/>',grid:'<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>',check:'<rect x="3" y="4" width="18" height="17" rx="2"/><path d="m8 12 2.5 2.5L16 9"/>',users:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>',wallet:'<rect x="3" y="6" width="18" height="15" rx="2"/><path d="M3 10h18M7 6V4a1 1 0 0 1 1-1h10"/><path d="M16 15h2"/>',store:'<path d="M3 10h18l-2-7H5l-2 7Zm1 0v11h16V10M9 21v-7h6v7"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',settings:'<circle cx="12" cy="12" r="3"/><path d="m19.4 15 .1.1 1.4 1.1-2 3.5-1.7-.7a8.5 8.5 0 0 1-2.4 1.4l-.3 1.8h-4l-.3-1.8a8.5 8.5 0 0 1-2.4-1.4l-1.7.7-2-3.5L5.5 15a8 8 0 0 1 0-2l-1.4-1.2 2-3.5 1.7.7a8.5 8.5 0 0 1 2.4-1.4l.3-1.8h4l.3 1.8a8.5 8.5 0 0 1 2.4 1.4l1.7-.7 2 3.5-1.4 1.2a8 8 0 0 1 0 2Z"/>',calendar:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4M17 3v4M3 10h18"/>',plus:'<path d="M12 5v14M5 12h14"/>',arrow:'<path d="M5 12h14m-6-6 6 6-6 6"/>',edit:'<path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L9 17l-4 1 1-4Z"/>',trash:'<path d="M3 6h18M8 6V4h8v2M6 6l1 15h10l1-15M10 10v7M14 10v7"/>',search:'<circle cx="11" cy="11" r="7"/><path d="m16 16 5 5"/>',download:'<path d="M12 3v12m-4-4 4 4 4-4M5 17v4h14v-4"/>',upload:'<path d="M12 16V4m-4 4 4-4 4 4M4 17v4h16v-4"/>',x:'<path d="M18 6 6 18M6 6l12 12"/>',sparkle:'<path d="m12 2 2.5 7.5L22 12l-7.5 2.5L12 22l-2.5-7.5L2 12l7.5-2.5L12 2Z"/>',mail:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 7 9-7"/>',location:'<path d="M20 10c0 5-8 12-8 12S4 15 4 10a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="2.5"/>',alert:'<path d="M12 9v4m0 4h.01M10 3 2 19h20L14 3Z"/>',pie:'<path d="M12 3v9h9A9 9 0 1 1 12 3Zm3 0a9 9 0 0 1 6 6h-6Z"/>',more:'<circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/>'};
const icon=(name)=>`<svg viewBox="0 0 24 24" aria-hidden="true">${ICONS[name]||ICONS.heart}</svg>`;
const SKEY='najindan-v1';const uid=()=>String(Date.now())+'-'+Math.random().toString(36).slice(2,9);
const starterTitles=[['Določita datum poroke','Organizacija'],['Določita okvirni proračun','Finance'],['Izberita lokacijo in preverita termin','Lokacija'],['Pripravita začetni seznam gostov','Gostje'],['Poiščita fotografa in glasbo','Ponudniki'],['Pripravita in pošljita vabila','Gostje'],['Uredita časovnico poročnega dne','Poročni dan']];
const PHOTO_DATA={"categories":[{"id":"zenin","name":"Ženinova obleka","emoji":"👔","description":"Dodajta zapiske in možnosti.","items":[]},{"id":"fotograf","name":"Fotograf","emoji":"📷","description":"Dodajta zapiske in možnosti.","items":[]},{"id":"dekoracija","name":"Dekoracija","emoji":"🎀","description":"Dodajta zapiske in možnosti.","items":[]},{"id":"roze","name":"Rože in cvetje","emoji":"💐","description":"Dodajta zapiske in možnosti.","items":[]},{"id":"ketering","name":"Ketering","emoji":"🍽️","description":"Dodajta zapiske in možnosti.","items":[]},{"id":"civilni","name":"Civilni obred","emoji":"🏛️","description":"Dodajta zapiske in možnosti.","items":[]},{"id":"cerkveni","name":"Cerkveni obred","emoji":"⛪","description":"Dodajta zapiske in možnosti.","items":[]},{"id":"gostilna","name":"Gostilna in slavje","emoji":"🏡","description":"Dodajta zapiske in možnosti.","items":[]},{"id":"ansambel","name":"Ansambel in glasba","emoji":"🎵","description":"Dodajta zapiske in možnosti.","items":[]},{"id":"gostje","name":"Gostje – zapiski","emoji":"👥","description":"Dodajta zapiske in možnosti.","items":[]}],"guests":[],"vendors":[]};
const copyPhoto = x=>JSON.parse(JSON.stringify(x));
const blank=()=>({version:3,photoImportVersion:1,settings:{names:'Najina poroka',date:'',place:'',budget:15000},tasks:starterTitles.map(([title,category])=>({id:uid(),title,category,priority:'Srednja',due:'',done:false})),guests:copyPhoto(PHOTO_DATA.guests),expenses:[],vendors:copyPhoto(PHOTO_DATA.vendors),timeline:[],categories:copyPhoto(PHOTO_DATA.categories),seatingTables:[]});
const load=()=>{try{let raw=localStorage.getItem(SKEY);if(!raw)return blank();let p=JSON.parse(raw);if(!p||!p.settings||!Array.isArray(p.tasks))return blank();let d=blank();let imported=p.photoImportVersion===1;let g=Array.isArray(p.guests)?p.guests:[],v=Array.isArray(p.vendors)?p.vendors:[];return {...d,...p,version:3,photoImportVersion:1,settings:{...d.settings,...p.settings},guests:imported?g:[...g,...copyPhoto(PHOTO_DATA.guests).filter(x=>!g.some(y=>y.id===x.id||y.name===x.name&&y.group===x.group))],vendors:imported?v:[...v,...copyPhoto(PHOTO_DATA.vendors).filter(x=>!v.some(y=>y.id===x.id||y.name===x.name))],categories:imported&&Array.isArray(p.categories)?p.categories:copyPhoto(PHOTO_DATA.categories),expenses:Array.isArray(p.expenses)?p.expenses:[],timeline:Array.isArray(p.timeline)?p.timeline:[],seatingTables:Array.isArray(p.seatingTables)?p.seatingTables:[]}}catch{return blank()}};
let data=load(),section='home',filters={tasks:'all',guests:'all',guestSide:'all',vendorSide:'all',search:'',bookmarkSearch:'',categoryId:'zenin'},modalState=null,toastTimer;
const save=()=>{try{localStorage.setItem(SKEY,JSON.stringify(data))}catch{notify('Shranjevanje ni uspelo. Izvozi varnostno kopijo.')}};
const esc=(v)=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>new Intl.NumberFormat('sl-SI',{style:'currency',currency:'EUR',maximumFractionDigits:0}).format(Number(n)||0);
const num=n=>new Intl.NumberFormat('sl-SI').format(Number(n)||0);
const pct=(n,d)=>d>0?Math.round(n/d*100):0;
const dateFmt=(s)=>{if(!s)return 'Brez datuma';let a=s.split('-');return a.length===3?`${Number(a[2])}. ${Number(a[1])}. ${a[0]}`:esc(s)};
const daysUntil=()=>{if(!data.settings.date)return null;const ds=data.settings.date.split('-').map(Number);const target=Date.UTC(ds[0],ds[1]-1,ds[2]);const now=new Date();const today=Date.UTC(now.getFullYear(),now.getMonth(),now.getDate());return Math.round((target-today)/86400000)};
const summ=()=>{const guests=data.guests.filter(g=>g.status==='Potrjeno').reduce((s,g)=>s+Math.max(0,Number(g.count)||0),0), invited=data.guests.reduce((s,g)=>s+Math.max(0,Number(g.count)||0),0), done=data.tasks.filter(t=>t.done).length, spent=data.expenses.reduce((s,e)=>s+(Number(e.amount)||0),0),paid=data.expenses.filter(e=>e.paid).reduce((s,e)=>s+(Number(e.amount)||0),0);return {guests,invited,done,spent,paid,budget:Number(data.settings.budget)||0}};
function notify(msg){let n=document.getElementById('toast');n.textContent=msg;n.classList.add('visible');clearTimeout(toastTimer);toastTimer=setTimeout(()=>n.classList.remove('visible'),3200)}
const N=[['home','Pregled','grid'],['bookmarks','Zaznamki','sparkle'],['tasks','Opravila','check'],['guests','Gostje','users'],['seating','Sedežni red','grid'],['budget','Proračun','wallet'],['vendors','Ponudniki','store'],['timeline','Časovnica','clock'],['settings','Nastavitve','settings']];
function drawNav(){document.getElementById('brandIcon').innerHTML=icon('heart');document.getElementById('sideHeart').innerHTML=icon('sparkle');document.getElementById('modalClose').innerHTML=icon('x');document.getElementById('nav').innerHTML=N.map(([key,label,ico])=>`<button type="button" class="${section===key?'active':''}" data-nav="${key}" ${section===key?'aria-current="page"':''}>${icon(ico)}<span>${label}</span>${key==='tasks'?`<span class="count">${data.tasks.filter(t=>!t.done).length}</span>`:''}</button>`).join('')}
function top(title,eyebrow='Poročni organizator'){const d=data.settings.date?dateFmt(data.settings.date):'Datum še ni določen';return `<div class="topbar"><div><div class="eyebrow">${eyebrow}</div><h1 class="page-title">${esc(title)}</h1></div><div class="top-actions"><div class="date-pill">${icon('calendar')} ${d}</div><button class="avatar" type="button" data-nav="settings" title="Nastavitve">♡</button></div></div>`}
function progress(v,max,col=''){return `<div class="progress-track"><div class="progress-fill" style="width:${Math.min(100,Math.max(0,pct(v,max)))}%;${col?`background:${col}`:''}"></div></div>`}
function empt(title,text,action='',type=''){return `<div class="empty"><div class="empty-art">♡</div><strong>${title}</strong><p>${text}</p>${action?`<button class="btn small secondary" data-add="${type}">${icon('plus')} ${action}</button>`:''}</div>`}
function statusTag(s){let cls=({'Potrjeno':'green','Zavrnjeno':'rose','Povabljeno':'gold','V čakanju':'gray','Rezervirano':'green','V dogovoru':'gold','V ožjem izboru':'gray','Odpovedano':'rose'})[s]||'gray';return `<span class="tag ${cls}">${esc(s||'—')}</span>`}
function metric(label,value,detail,ic,c){return `<article class="metric"><div class="metric-top"><span>${label}</span><span class="metric-icon ${c}">${icon(ic)}</span></div><div class="metric-value">${value}</div><div class="metric-foot">${detail}</div></article>`}
function home(){const s=summ(),days=daysUntil(),todo=data.tasks.filter(t=>!t.done).sort((a,b)=>(a.due||'9999').localeCompare(b.due||'9999')).slice(0,4);const budgetGroups=categoryTotals().slice(0,4);let displayDays=days===null?'—':days<0?'✓':num(days);let dayText=days===null?'Določita datum poroke':days<0?'Vajin dan je že za vama':days===0?'Danes je vajin dan!':'Do vajinega dne';return `${top('Pozdravljena! ♡','Dobrodošla v vajinem načrtu')}<section class="hero"><div class="hero-content"><div class="hero-tag">✦ Vajina zgodba, vajin dan</div><h2>${esc(data.settings.names||'Najina poroka')}</h2><p>${data.settings.date?`${dateFmt(data.settings.date)}${data.settings.place?' · '+esc(data.settings.place):''}`:'Začnita načrtovati dan, ki ga ne bosta pozabila.'}</p><div class="quicklink"><button class="btn" data-nav="bookmarks">${icon('sparkle')} Zapiski iz zvezka</button><button class="btn secondary" data-nav="settings">${icon('edit')} Uredi poroko</button></div></div><div class="hero-orbit">♡</div></section><section class="metrics">${metric('Do poroke',displayDays,dayText,'calendar','lilac')}${metric('Gostje',num(s.guests),`Od ${num(s.invited)} povabljenih oseb potrjeno`,'users','sage')}${metric('Proračun',money(s.budget-s.spent),'Preostanek glede na vnesene stroške','wallet','gold')}${metric('Opravljena opravila',`${s.done}/${data.tasks.length}`,`${pct(s.done,data.tasks.length)} % opravljenega`,'check','')}</section><div class="grid-2"><div class="card card-pad"><div class="card-heading"><div><h3>Opravila v ospredju</h3><p>Najbližji koraki do vajinega dne</p></div><button class="text-btn" data-nav="tasks">Vsa opravila ${icon('arrow')}</button></div>${progress(s.done,data.tasks.length)}<div class="progress-legend"><span>Napredek priprav</span><strong>${pct(s.done,data.tasks.length)} %</strong></div><div class="section-spacer"></div>${todo.length?`<div class="task-list">${todo.map(t=>`<div class="task-row"><input type="checkbox" class="check-input" aria-label="Opravi ${esc(t.title)}" data-check="${esc(t.id)}"><div class="task-body"><div class="task-title">${esc(t.title)}</div><div class="task-meta"><span>${esc(t.category)}</span>${t.due?`<span>${dateFmt(t.due)}</span>`:''}</div></div>${t.priority==='Visoka'?'<span class="tag rose">Pomembno</span>':''}</div>`).join('')}</div>`:empt('Vsa opravila so opravljena','Odlično! Dodajta novo opravilo, ko bo potrebno.','Dodaj opravilo','tasks')}</div><div class="card card-pad"><div class="card-heading"><div><h3>Proračun po področjih</h3><p>Načrtovani in plačani stroški</p></div><button class="text-btn" data-nav="budget">Poglej več ${icon('arrow')}</button></div>${budgetGroups.length?budgetGroups.map(([name,amount])=>`<div class="budget-row"><div class="budget-row-title"><span>${esc(name)}</span><span>${money(amount)}</span></div>${progress(amount,s.budget||amount||1)}</div>`).join('')+`<div class="divider"></div><div class="progress-legend"><span>Skupni vneseni stroški</span><strong>${money(s.spent)}</strong></div>`:empt('Še ni stroškov','Prvi strošek dodajta v proračun.','Dodaj strošek','expenses')}</div></div><div class="section-spacer"></div><div class="grid-2 equal"><div class="card card-pad"><div class="card-heading"><div><h3>Seznam gostov</h3><p>Odzivi in potrditve</p></div><button class="text-btn" data-nav="guests">Uredi goste ${icon('arrow')}</button></div><div class="stat-strip" style="margin-bottom:0"><div class="stat-box"><label>Povabljenih oseb</label><strong>${num(s.invited)}</strong></div><div class="stat-box"><label>Potrjenih oseb</label><strong>${num(s.guests)}</strong></div><div class="stat-box"><label>Vnosov na seznamu</label><strong>${num(data.guests.length)}</strong></div></div></div><div class="card card-pad"><div class="card-heading"><div><h3>Poročni dan</h3><p>Ustvarita urnik po vajinih željah</p></div><button class="text-btn" data-nav="timeline">Časovnica ${icon('arrow')}</button></div>${data.timeline.length?data.timeline.slice().sort((a,b)=>a.time.localeCompare(b.time)).slice(0,3).map(i=>`<div class="task-row" style="margin-bottom:8px"><span style="color:var(--rose);font-weight:800">${esc(i.time)}</span><span class="task-title">${esc(i.title)}</span></div>`).join(''):empt('Časovnica čaka na vaju','Dodajta ključne trenutke poročnega dne.','Dodaj dogodek','timeline')}</div></div>`}


function assignedSeatMap(){let map=new Map();for(let t of (data.seatingTables||[])){for(let gid of (t.guestIds||[]))map.set(gid,t.id)}return map}
function assignedPersonTotal(){let map=assignedSeatMap(),sum=0;for(let g of data.guests){if(map.has(g.id))sum+=Math.max(0,Number(g.count)||0)}return sum}
function guestsForTable(table){let ids=new Set(table.guestIds||[]);return data.guests.filter(g=>ids.has(g.id))}
function tablePersons(table){return guestsForTable(table).reduce((s,g)=>s+Math.max(0,Number(g.count)||0),0)}
function assignGuestToTable(guestId,tableId){data.seatingTables=(data.seatingTables||[]).map(t=>({...t,guestIds:(t.guestIds||[]).filter(id=>id!==guestId)}));if(tableId){let t=data.seatingTables.find(x=>x.id===tableId);if(t){t.guestIds=Array.isArray(t.guestIds)?t.guestIds:[];if(!t.guestIds.includes(guestId))t.guestIds.push(guestId)}}save();render();notify(tableId?'Gost je dodeljen mizi.':'Gost je odstranjen iz sedežnega reda.')}
function seating(){const tables=(data.seatingTables||[]).slice();const seatMap=assignedSeatMap();const totalPersons=data.guests.reduce((s,g)=>s+Math.max(0,Number(g.count)||0),0);const assignedGroups=seatMap.size;const unassigned=data.guests.filter(g=>!seatMap.has(g.id));const freeSeats=tables.reduce((s,t)=>s+Math.max(0,(Number(t.capacity)||0)-tablePersons(t)),0);return `${top('Sedežni red','Razporeditev po mizah')}<div class="section-head"><div><h2>Načrtujta mize in razpored gostov</h2><p>Dodajta mize, določita kapaciteto in nato posamezne goste ali družine razporedita po mizah. Goste lahko kadarkoli prestavita.</p></div><button class="btn" data-add="seatingTables">${icon('plus')} Dodaj mizo</button></div><div class="planner-tip"><strong>Namig:</strong> razporejate lahko posamezne vnose s seznama gostov. Če je v enem vnosu zapisana družina z več osebami, se celotna skupina premakne skupaj.</div><div class="seat-summary"><div class="seat-stat"><label>Mize</label><strong>${num(tables.length)}</strong><span>Skupno ustvarjenih miz</span></div><div class="seat-stat"><label>Razporejeni vnosi</label><strong>${num(assignedGroups)}</strong><span>Od ${num(data.guests.length)} zapisov gostov</span></div><div class="seat-stat"><label>Razporejene osebe</label><strong>${num(assignedPersonTotal())}</strong><span>Od ${num(totalPersons)} vseh oseb</span></div><div class="seat-stat"><label>Prosti sedeži</label><strong>${num(freeSeats)}</strong><span>Glede na kapacitete miz</span></div></div><div class="seating-layout"><div><div class="tables-grid">${tables.length?tables.map(t=>`<article class="card table-card"><div class="table-top"><div><h3>${esc(t.name)}</h3><div class="table-meta">${num(tablePersons(t))} / ${num(t.capacity||0)} oseb</div></div><div class="table-actions"><button class="btn icon-only" data-edit="seatingTables" data-id="${esc(t.id)}" title="Uredi mizo">${icon('edit')}</button><button class="btn icon-only" data-delete="seatingTables" data-id="${esc(t.id)}" title="Izbriši mizo">${icon('trash')}</button></div></div>${progress(tablePersons(t),Math.max(1,Number(t.capacity)||1),tablePersons(t)>(Number(t.capacity)||0)?'#ac4e54':'')}<div class="seat-stack" style="margin-top:12px">${guestsForTable(t).length?guestsForTable(t).map(g=>`<div class="seat-pill"><div><strong>${esc(g.name)}</strong><small>${esc(g.group||'Gost')} · ${num(g.count)} os.</small></div><button class="btn small secondary" data-unseat="${esc(g.id)}">Odstrani</button></div>`).join(''):`<div class="seat-empty">Na to mizo še ni dodeljenih gostov.</div>`}</div>${t.note?`<div class="table-note">${esc(t.note)}</div>`:''}</article>`).join(''):empt('Sedežni red še ni ustvarjen','Dodajta prvo mizo in začnita razporejati goste.','Dodaj mizo','seatingTables')}</div></div><div><div class="card card-pad"><div class="card-heading"><div><h3>Razporeditev gostov</h3><p>Vsak zapis lahko dodelita mizi ali pustita nerazporejenega.</p></div></div><div class="assignment-list">${data.guests.map(g=>`<div class="assignment-row"><div class="guest-brief"><strong>${esc(g.name)}</strong><small>${esc(g.group||'Gostje')} · ${num(g.count)} os.${g.review?' · preveriti zapis':''}</small></div><div><select class="table-select" data-seat-assign="${esc(g.id)}"><option value="">Ni dodeljeno</option>${tables.map(t=>`<option value="${esc(t.id)}" ${seatMap.get(g.id)===t.id?'selected':''}>${esc(t.name)}</option>`).join('')}</select></div></div>`).join('')}</div></div>${unassigned.length?`<div class="card card-pad" style="margin-top:18px"><div class="card-heading"><div><h3>Nerazporejeni</h3><p>Še brez mize</p></div><span class="tag gray">${num(unassigned.length)} vnosov</span></div><div class="task-list">${unassigned.map(g=>`<div class="task-row"><div class="task-body"><div class="task-title">${esc(g.name)}</div><div class="task-meta"><span>${esc(g.group||'Gostje')}</span><span>${num(g.count)} os.</span>${g.review?'<span>preveriti zapis</span>':''}</div></div></div>`).join('')}</div></div>`:''}</div></div>`}

function chosenCategory(){if(!Array.isArray(data.categories))data.categories=[];let c=data.categories.find(x=>x.id===filters.categoryId);if(!c){c=data.categories[0];filters.categoryId=c?.id||''}return c}
function bookmarks(){let c=chosenCategory(),query=(filters.bookmarkSearch||'').toLocaleLowerCase('sl');const matching=(x)=>[x.title,x.details,x.phone,x.email,x.address,x.status].join(' ').toLocaleLowerCase('sl').includes(query);return `${top('Zaznamki in kategorije','Vajin digitalni poročni zvezek')}<div class="section-head"><div><h2>Vse ideje in kontakti na enem mestu</h2><p>Dodajajta, preimenujta in razvrščajta kategorije. Vse zapiske lahko urejata.</p></div><button class="btn" data-add="categories">${icon('plus')} Nova kategorija</button></div><div class="photo-note"><strong>Začetne kategorije so pripravljene.</strong> Svoje zasebne zapiske lahko dodata ali uvozita iz varnostne kopije. Ponudbe niso avtomatsko plačani stroški. Podatki ostanejo shranjeni v tem brskalniku.</div><div class="bookmark-layout"><aside class="card category-sidebar"><div class="category-toolbar"><strong>Kategorije <span class="count-pill">${data.categories.length}</span></strong><button class="btn small secondary" data-add="categories" title="Dodaj kategorijo">${icon('plus')}</button></div><div class="category-list">${data.categories.map((cat,i)=>`<div class="category-line ${c?.id===cat.id?'selected':''}"><button class="cat-select" data-select-category="${esc(cat.id)}" aria-current="${c?.id===cat.id?'true':'false'}"><span class="cat-emoji">${esc(cat.emoji||'📌')}</span><span class="cat-label">${esc(cat.name)}</span></button><button class="tiny-icon" data-move-category="${esc(cat.id)}" data-dir="-1" title="Premakni gor" aria-label="Premakni ${esc(cat.name)} gor" ${i===0?'disabled':''}>↑</button><button class="tiny-icon" data-move-category="${esc(cat.id)}" data-dir="1" title="Premakni dol" aria-label="Premakni ${esc(cat.name)} dol" ${i===data.categories.length-1?'disabled':''}>↓</button><button class="tiny-icon" data-edit="categories" data-id="${esc(cat.id)}" title="Preimenuj in uredi" aria-label="Uredi ${esc(cat.name)}">${icon('edit')}</button></div>`).join('')}</div></aside><section class="bookmark-content">${c?`<div class="card bookmark-intro"><div class="bookmark-head"><div class="bookmark-hero-icon">${esc(c.emoji||'📌')}</div><div><h2>${esc(c.name)}</h2><p>${esc(c.description||'Vajini zapiski in ideje.')}</p><div class="quicklink">${c.id==='gostje'?`<button class="btn secondary small" data-nav="guests">${icon('users')} Odpri seznam gostov</button>`:c.id==='fotograf'||c.id==='roze'||c.id==='ketering'||c.id==='civilni'||c.id==='cerkveni'||c.id==='gostilna'||c.id==='ansambel'?`<button class="btn secondary small" data-nav="vendors">${icon('store')} Vsi ponudniki</button>`:''}</div></div></div><div class="bookmark-buttons"><button class="btn small" data-add="bookmarks" data-category-id="${esc(c.id)}">${icon('plus')} Dodaj zapis</button><button class="btn small secondary" data-edit="categories" data-id="${esc(c.id)}">${icon('edit')} Uredi kategorijo</button><button class="btn small ghost" data-delete-category="${esc(c.id)}">${icon('trash')} Izbriši kategorijo</button></div></div><div class="toolbar"><div class="search" style="width:100%">${icon('search')}<input data-bookmark-search type="search" aria-label="Išči zapiske v kategoriji" placeholder="Išči po tej kategoriji …" value="${esc(filters.bookmarkSearch)}"></div></div><div class="bookmark-items">${(c.items||[]).filter(matching).map(x=>`<article class="card bookmark-item"><div class="bookmark-item-head"><div><h3>${esc(x.title)}</h3><span class="tag ${x.status==='Naredimo sami'?'green':x.status==='Ponudba'?'gold':'gray'}">${esc(x.status||'Zapis')}</span></div><div class="row-actions"><button data-edit="bookmarks" data-id="${esc(x.id)}" data-category-id="${esc(c.id)}" title="Uredi zapis" aria-label="Uredi ${esc(x.title)}">${icon('edit')}</button><button data-delete-bookmark="${esc(x.id)}" data-category-id="${esc(c.id)}" title="Izbriši zapis" aria-label="Izbriši ${esc(x.title)}">${icon('trash')}</button></div></div>${x.details?`<p class="bookmark-note">${esc(x.details)}</p>`:''}${x.price?`<div class="bookmark-price">${icon('wallet')} Ponudba: ${/^\d+([.,]\d+)?$/.test(String(x.price))?money(String(x.price).replace(',','.')):esc(x.price)+' €'}</div>`:''}${x.review?'<div><span class="review-flag">⚠ Preveri prepis oziroma podrobnosti</span></div>':''}${x.phone||x.email||x.address?`<div class="bookmark-contact">${x.phone?`<a href="tel:${esc(String(x.phone).replace(/[^0-9+]/g,''))}">☎ ${esc(x.phone)}</a>`:''}${x.email?`<a href="mailto:${esc(String(x.email).replace(/[^a-zA-Z0-9@._+\-]/g,''))}">✉ ${esc(x.email)}</a>`:''}${x.address?`<span>📍 ${esc(x.address)}</span>`:''}</div>`:''}</article>`).join('')||empt('Tukaj še ni zadetkov','Dodajta zapis ali počistita iskanje.','Dodaj zapis','bookmarks')}</div>`:`<div class="card card-pad">${empt('Ni še kategorij','Ustvarita prvo kategorijo in vanjo dodajta zapiske.')}</div>`}</section></div>`}
function moveCategory(id,direction){let idx=data.categories.findIndex(c=>c.id===id),next=idx+Number(direction);if(idx<0||next<0||next>=data.categories.length)return;[data.categories[idx],data.categories[next]]=[data.categories[next],data.categories[idx]];save();render();notify('Vrstni red kategorij je posodobljen.')}
function deleteCategory(id){let c=data.categories.find(c=>c.id===id);if(!c)return;if(!confirm(`Izbrišem kategorijo »${c.name}« in njenih ${c.items?.length||0} zapiskov? Podatki v ločenih seznamih gostov in ponudnikov se ne izbrišejo.`))return;data.categories=data.categories.filter(x=>x.id!==id);filters.categoryId=data.categories[0]?.id||'';save();render();notify('Kategorija je izbrisana.')}
function deleteBookmark(cid,id){let c=data.categories.find(x=>x.id===cid),x=c?.items?.find(i=>i.id===id);if(!x)return;if(!confirm(`Izbrišem zapis »${x.title}«?`))return;c.items=c.items.filter(y=>y.id!==id);save();render();notify('Zapis je izbrisan.')}

function taskFilter(){return data.tasks.filter(t=>(filters.tasks==='all'||(filters.tasks==='open'&&!t.done)||(filters.tasks==='done'&&t.done))&&`${t.title} ${t.category}`.toLowerCase().includes(filters.search.toLowerCase()))}
function tasks(){let arr=taskFilter().sort((a,b)=>Number(a.done)-Number(b.done)||(a.due||'9999').localeCompare(b.due||'9999'));return `${top('Opravila')}<div class="section-head"><div><h2>Seznam opravil</h2><p>Vsa velika in majhna opravila, ki vodijo do vajinega dne.</p></div><button class="btn" data-add="tasks">${icon('plus')} Novo opravilo</button></div><div class="toolbar"><div class="filter-chips">${[['all','Vsa'],['open','Odprta'],['done','Opravljena']].map(([k,t])=>`<button class="chip ${filters.tasks===k?'selected':''}" data-filter-tasks="${k}">${t}</button>`).join('')}</div><div class="search">${icon('search')}<input data-search aria-label="Išči opravila" type="search" placeholder="Išči po opravilih ..." value="${esc(filters.search)}"></div></div><div class="card card-pad">${arr.length?`<div class="task-list">${arr.map(t=>`<div class="task-row"><input class="check-input" type="checkbox" aria-label="Označi ${esc(t.title)}" data-check="${esc(t.id)}" ${t.done?'checked':''}><div class="task-body"><div class="task-title ${t.done?'done':''}">${esc(t.title)}</div><div class="task-meta"><span>${esc(t.category||'Drugo')}</span>${t.due?`<span>${icon('calendar')} ${dateFmt(t.due)}</span>`:''}</div></div>${t.priority==='Visoka'?'<span class="tag rose">Visoka</span>':t.priority==='Nizka'?'<span class="tag green">Nizka</span>':''}<div class="row-actions"><button data-edit="tasks" data-id="${esc(t.id)}" title="Uredi">${icon('edit')}</button><button data-delete="tasks" data-id="${esc(t.id)}" title="Izbriši">${icon('trash')}</button></div></div>`).join('')}</div>`:empt('Ni opravil za prikaz','Spremeni filter ali dodaj novo opravilo.','Dodaj opravilo','tasks')}</div>`}
function guests(){const count=(status)=>data.guests.filter(g=>g.status===status).reduce((sum,g)=>sum+Math.max(0,Number(g.count)||0),0);let arr=data.guests.filter(g=>(filters.guests==='all'||g.status===filters.guests)&&(filters.guestSide==='all'||g.group===filters.guestSide)&&`${g.name} ${g.group} ${g.email} ${g.note}`.toLowerCase().includes(filters.search.toLowerCase())).sort((a,b)=>a.name.localeCompare(b.name,'sl'));return `${top('Gostje')}<div class="section-head"><div><h2>Seznam gostov</h2><p>Dodajta goste ali jih uvozita iz obstoječe varnostne kopije.</p></div><button class="btn" data-add="guests">${icon('plus')} Dodaj gosta</button></div><div class="stat-strip">${[['Na seznamu (znane osebe)',summ().invited],['Potrjena udeležba',count('Potrjeno')],['Še čaka odgovor',count('Povabljeno')+count('V čakanju')]].map(([a,b])=>`<div class="stat-box"><label>${a}</label><strong>${num(b)}</strong></div>`).join('')}</div><div class="toolbar"><div class="filter-chips">${[['all','Vse skupine'],['Moji','Moji'],['Partnerjevi','Partnerjevi'],['Skupni','Skupni']].map(([k,l])=>`<button class="chip ${filters.guestSide===k?'selected':''}" data-filter-guest-side="${k}">${l}</button>`).join('')}</div></div><div class="toolbar"><div class="filter-chips">${[['all','Vsi'],['Povabljeno','Povabljeni'],['Potrjeno','Potrjeni'],['Zavrnjeno','Ne pridejo']].map(([k,l])=>`<button class="chip ${filters.guests===k?'selected':''}" data-filter-guests="${k}">${l}</button>`).join('')}</div><div class="search">${icon('search')}<input data-search aria-label="Išči goste" type="search" placeholder="Išči gosta ..." value="${esc(filters.search)}"></div></div><div class="card padded-table">${arr.length?`<div class="table-wrap"><table class="data-table"><thead><tr><th>Gost / skupina</th><th>Št. oseb</th><th>Skupina</th><th>Odgovor</th><th>Opombe</th><th></th></tr></thead><tbody>${arr.map(g=>`<tr><td><strong>${esc(g.name)}</strong>${g.review?'<small>⚠ Preveriti zapis</small>':''}${g.email?`<small>${esc(g.email)}</small>`:''}</td><td>${Number(g.count)>0?num(g.count):'Za preveriti'}</td><td>${esc(g.group||'—')}</td><td>${statusTag(g.status)}</td><td>${esc(g.note||'—')}</td><td><div class="row-actions"><button data-edit="guests" data-id="${esc(g.id)}" title="Uredi">${icon('edit')}</button><button data-delete="guests" data-id="${esc(g.id)}" title="Izbriši">${icon('trash')}</button></div></td></tr>`).join('')}</tbody></table></div>`:`<div style="padding:16px">${empt('Seznam je še prazen','Dodajta prve goste ali spremenita filter.','Dodaj gosta','guests')}</div>`}</div>`}
function categoryTotals(){const groups={};for(let e of data.expenses){let c=e.category||'Drugo';groups[c]=(groups[c]||0)+(Number(e.amount)||0)}return Object.entries(groups).sort((a,b)=>b[1]-a[1])}
function budget(){let s=summ();let items=data.expenses.slice().sort((a,b)=>a.category.localeCompare(b.category,'sl'));let over=s.spent>s.budget;return `${top('Proračun')}<div class="section-head"><div><h2>Poročni proračun</h2><p>Spremljajta načrtovane zneske, obveznosti in plačila.</p></div><button class="btn" data-add="expenses">${icon('plus')} Dodaj strošek</button></div><section class="metrics">${metric('Skupni proračun',money(s.budget),'Uredi ga v nastavitvah','wallet','gold')}${metric('Vneseni stroški',money(s.spent),`${pct(s.spent,s.budget)} % proračuna`,'pie','')}${metric('Že plačano',money(s.paid),'Potrjena plačila','check','sage')}${metric('Še na voljo',money(s.budget-s.spent),over?'Presežen proračun':'Po odštetju vnesenih stroškov','wallet','lilac')}</section><div class="grid-2 equal"><div class="card card-pad"><div class="card-heading"><div><h3>Poraba proračuna</h3><p>Vsi vneseni stroški glede na omejitev</p></div></div>${progress(s.spent,s.budget||1,over?'#b76667':'#668674')}<div class="progress-legend"><span>${money(s.spent)} od ${money(s.budget)}</span><strong>${pct(s.spent,s.budget)} %</strong></div>${over?'<div class="callout" style="margin-top:17px"><strong>Pozor:</strong> Vneseni stroški so višji od zastavljenega proračuna.</div>':''}</div><div class="card card-pad"><div class="card-heading"><div><h3>Poraba po kategorijah</h3><p>Katere postavke predstavljajo največji delež?</p></div></div>${categoryTotals().length?categoryTotals().map(([name,amount])=>`<div class="budget-row"><div class="budget-row-title"><span>${esc(name)}</span><span>${money(amount)}</span></div>${progress(amount,s.spent||1,'#b8787b')}</div>`).join(''):empt('Še ni porabe','Dodajta prvo postavko proračuna.')}</div></div><div class="section-spacer"></div><div class="card"><div class="card-heading card-pad" style="margin-bottom:0"><div><h3>Vse postavke</h3><p>Načrtovani stroški in stanje plačil</p></div></div>${items.length?`<div class="table-wrap"><table class="data-table"><thead><tr><th>Postavka</th><th>Kategorija</th><th>Znesek</th><th>Plačilo</th><th></th></tr></thead><tbody>${items.map(e=>`<tr><td><strong>${esc(e.title)}</strong>${e.note?`<small>${esc(e.note)}</small>`:''}</td><td>${esc(e.category)}</td><td><strong>${money(e.amount)}</strong></td><td><button class="chip ${e.paid?'selected':''}" data-paid="${esc(e.id)}" title="Spremeni status plačila">${e.paid?'✓ Plačano':'Ni plačano'}</button></td><td><div class="row-actions"><button data-edit="expenses" data-id="${esc(e.id)}" title="Uredi">${icon('edit')}</button><button data-delete="expenses" data-id="${esc(e.id)}" title="Izbriši">${icon('trash')}</button></div></td></tr>`).join('')}</tbody></table></div>`:`<div style="padding:0 23px 23px">${empt('Ni vnesenih stroškov','Vnesita stroške za lokacijo, hrano, glasbo in druge podrobnosti.','Dodaj strošek','expenses')}</div>`}</div>`}
function vendors(){let arr=data.vendors.slice().sort((a,b)=>a.name.localeCompare(b.name,'sl'));return `${top('Ponudniki')}<div class="section-head"><div><h2>Najini ponudniki</h2><p>Ponudbe ponudnikov niso samodejno vključene med stroške proračuna.</p></div><button class="btn" data-add="vendors">${icon('plus')} Dodaj ponudnika</button></div>${arr.length?`<div class="vendor-grid">${arr.map(v=>`<div class="card vendor"><div class="vendor-top"><div class="metric-icon gold">${icon('store')}</div>${statusTag(v.status)}</div><div class="vendor-name">${esc(v.name)}</div><div class="vendor-category">${esc(v.category||'Drugo')}</div>${v.note?`<p class="vendor-notes">${esc(v.note)}</p>`:''}<div class="vendor-detail"><span>${v.contact?`${icon('mail')} ${esc(v.contact)}`:'Ni kontakta'}</span><strong>${Number(v.quote)>0?money(v.quote):'Brez ponudbe'}</strong></div><div class="row-actions" style="margin-top:11px"><button data-edit="vendors" data-id="${esc(v.id)}" title="Uredi">${icon('edit')}</button><button data-delete="vendors" data-id="${esc(v.id)}" title="Izbriši">${icon('trash')}</button></div></div>`).join('')}</div>`:empt('Vajina ekipa še čaka','Vnesita prvega ponudnika in vajine dogovore.','Dodaj ponudnika','vendors')}<div class="section-spacer"></div><div class="callout"><strong>Namig:</strong> Vnesene ponudbe tukaj so informativne. Dejanske stroške dodajta tudi v razdelek Proračun, kjer jih lahko označita kot plačane.</div>`}
function timeline(){let arr=data.timeline.slice().sort((a,b)=>a.time.localeCompare(b.time));return `${top('Časovnica')}<div class="section-head"><div><h2>Potek poročnega dne</h2><p>Ustvarita pregled trenutkov, da bo na dan poroke vse teklo po načrtu.</p></div><button class="btn" data-add="timeline">${icon('plus')} Dodaj dogodek</button></div><div class="grid-2"><div class="card card-pad">${arr.length?`<div class="schedule">${arr.map(t=>`<div class="schedule-item"><div class="schedule-actions row-actions"><button data-edit="timeline" data-id="${esc(t.id)}" title="Uredi">${icon('edit')}</button><button data-delete="timeline" data-id="${esc(t.id)}" title="Izbriši">${icon('trash')}</button></div><div class="schedule-time">${esc(t.time)}</div><div class="schedule-title">${esc(t.title)}</div>${t.note?`<p class="schedule-note">${esc(t.note)}</p>`:''}</div>`).join('')}</div>`:empt('Ustvarita svojo časovnico','Na primer priprave, obred, fotografiranje, večerja in prvi ples.','Dodaj dogodek','timeline')}</div><div><div class="card card-pad"><div class="card-heading"><div><h3>Podatki o dnevu</h3><p>Naj bo pomembno na enem mestu</p></div></div><div class="task-row">${icon('calendar')}<div class="task-body"><div class="task-title">Datum poroke</div><div class="task-meta">${data.settings.date?dateFmt(data.settings.date):'Še ni določen'}</div></div></div><div class="section-spacer"></div><div class="task-row">${icon('location')}<div class="task-body"><div class="task-title">Lokacija</div><div class="task-meta">${esc(data.settings.place||'Še ni določena')}</div></div></div><div class="section-spacer"></div><button class="btn secondary" data-nav="settings">${icon('edit')} Uredi podatke</button></div></div></div>`}
function settings(){return `${top('Nastavitve')}<div class="section-head"><div><h2>Podatki o vajini poroki</h2><p>Te podrobnosti se bodo prikazale v vajinem načrtovalniku.</p></div></div><div class="settings-grid"><div class="card card-pad"><form id="settingsForm" class="settings-form"><div class="field full"><label for="names">Imeni / naslov poroke</label><input name="names" id="names" maxlength="100" required value="${esc(data.settings.names)}" placeholder="Npr. Ana & Luka"></div><div class="field"><label for="weddingDate">Datum poroke</label><input name="date" id="weddingDate" type="date" value="${esc(data.settings.date)}"></div><div class="field"><label for="plannedBudget">Skupni proračun (€)</label><input name="budget" id="plannedBudget" type="number" min="0" step="1" value="${Number(data.settings.budget)||0}"></div><div class="field full"><label for="place">Lokacija poroke</label><input name="place" id="place" maxlength="150" value="${esc(data.settings.place)}" placeholder="Npr. Dvorec, Ljubljana"></div><div class="field full"><button class="btn" type="submit">${icon('check')} Shrani podatke</button></div></form></div><div class="card card-pad"><div class="card-heading"><div><h3>Varnostna kopija</h3><p>Vajini podatki so shranjeni samo v tem brskalniku.</p></div></div><div class="callout"><strong>Pomembno:</strong> Brisanje podatkov brskalnika lahko izbriše tudi vajin načrt. Redno izvozita varnostno kopijo (JSON). Datoteko lahko kasneje znova uvozita.</div><div class="section-spacer"></div><div style="display:flex;flex-wrap:wrap;gap:9px"><button class="btn secondary" data-export>${icon('download')} Izvozi podatke</button><button class="btn secondary" data-import>${icon('upload')} Uvozi podatke</button></div><div class="divider"></div><h3 class="section-title">Začni znova</h3><p class="section-description" style="margin-bottom:13px">Obnovi izvirne podatke iz varnostne kopije in začetna opravila. Vse poznejše spremembe bodo izbrisane.</p><button class="btn ghost small" data-reset>${icon('trash')} Ponastavi načrtovalnik</button></div></div>`}
function render(keepSearchFocus=false){let focus=keepSearchFocus&&document.activeElement?.hasAttribute('data-search');let pos=focus?document.activeElement.selectionStart:0;drawNav();const views={home,bookmarks,tasks,guests,seating,budget,vendors,timeline,settings};document.getElementById('app').innerHTML=(views[section]||home)()+`<div class="footer">NajinDan · Vajin dan, vajina zgodba ♡ · Vajina poroka na enem mestu</div>`;if(focus){let el=document.querySelector('[data-search]');if(el){el.focus();el.setSelectionRange(pos,pos)}}}
const options={category:['Organizacija','Lokacija','Gostje','Finance','Ponudniki','Poročni dan','Drugo'],priority:['Nizka','Srednja','Visoka'],guestgroup:['Moji','Partnerjevi','Skupni','Družina','Prijatelji','Sodelavci','Drugo'],gueststatus:['Povabljeno','Potrjeno','Zavrnjeno','V čakanju'],expensecat:['Lokacija','Hrana in pijača','Fotografija in video','Glasba','Obleke','Cvetje in dekoracija','Vabila','Prevoz','Prstani','Drugo'],vendorcat:['Lokacija','Catering','Fotograf','Video','Glasba','Cvetje','Dekoracija','Ličenje in frizura','Prevoz','Drugo'],vendorstatus:['V ožjem izboru','V dogovoru','Rezervirano','Odpovedano']};
function field(name,label,type='text',value='',opts={}){let inp='';let v=esc(value??'');if(type==='select'){const o=opts.options||[];inp=`<select name="${name}" id="f-${name}" required>${o.map(x=>`<option value="${esc(x)}" ${String(x)===String(value)?'selected':''}>${esc(x)}</option>`).join('')}</select>`}else if(type==='textarea'){inp=`<textarea name="${name}" id="f-${name}" maxlength="3000" placeholder="${esc(opts.placeholder||'')}">${v}</textarea>`}else if(type==='checkbox'){inp=`<label style="display:flex;gap:9px;align-items:center;cursor:pointer"><input id="f-${name}" name="${name}" type="checkbox" style="width:auto" ${value?'checked':''}><span>${label}</span></label>`;return `<div class="field ${opts.full?'full':''}">${inp}</div>`}else{inp=`<input name="${name}" id="f-${name}" type="${type}" value="${v}" ${opts.required?'required':''} ${opts.min!==undefined?`min="${opts.min}"`:''} ${opts.step?`step="${opts.step}"`:''} maxlength="${opts.maxlength||160}" placeholder="${esc(opts.placeholder||'')}">`}return `<div class="field ${opts.full?'full':''}"><label for="f-${name}">${label}</label>${inp}</div>`}
const forms={categories:{label:'kategorijo',fields:o=>field('name','Ime kategorije','text',o.name,{required:true,full:true,placeholder:'Npr. Poročna torta'})+field('emoji','Ikona','select',o.emoji||'📌',{options:['📌','💐','🎀','📷','🎵','👥','👔','🍽️','🏛️','⛪','🏡','💍','✨','💌','🚗','🎂','💄','💡']})+field('description','Opis kategorije','textarea',o.description,{full:true})},bookmarks:{label:'zapis',fields:o=>field('title','Naslov zapisa','text',o.title,{required:true,full:true})+field('status','Status','select',o.status||'Ideja / možnost',{options:['Ideja / možnost','Za urediti','Za primerjati','Za naročiti','Naredimo sami','Za preveriti','V izboru','Ponudba','Rezervirano','Potrjeno','Preneseno v goste']})+field('price','Ponudbena cena (€)','text',o.price,{placeholder:'npr. 1000'})+field('details','Podrobnosti / zapiski','textarea',o.details,{full:true})+field('phone','Telefon','tel',o.phone)+field('email','E-pošta','email',o.email)+field('address','Naslov / lokacija','text',o.address,{full:true})+field('review','Označi za preverjanje','checkbox',o.review,{full:true})},seatingTables:{label:'mizo',fields:o=>field('name','Ime mize','text',o.name,{required:true,full:true,placeholder:'Npr. Miza 1 ali Družina'})+field('capacity','Število sedežev','number',o.capacity??8,{required:true,min:1,step:1})+field('note','Opombe','textarea',o.note,{full:true,placeholder:'Npr. blizu plesišča, družina, otroci...'})},tasks:{label:'opravilo',fields:o=>field('title','Naziv opravila','text',o.title,{required:true,full:true,placeholder:'Npr. Rezervirajta fotografa'})+field('category','Področje','select',o.category||'Organizacija',{options:options.category})+field('priority','Pomembnost','select',o.priority||'Srednja',{options:options.priority})+field('due','Rok za izvedbo','date',o.due,{full:true})},guests:{label:'gosta',fields:o=>field('name','Ime gosta / družine','text',o.name,{required:true,full:true,placeholder:'Npr. Ana Novak ali družina Novak'})+field('count','Število oseb','number',o.count??1,{required:true,min:0,step:1})+field('status','Odgovor','select',o.status||'V čakanju',{options:options.gueststatus})+field('group','Skupina','select',o.group||'Skupni',{options:options.guestgroup})+field('email','E-pošta (neobvezno)','email',o.email)+field('note','Opombe / prehrana','textarea',o.note,{full:true,placeholder:'Npr. vegetarijanski meni'})},expenses:{label:'strošek',fields:o=>field('title','Postavka','text',o.title,{required:true,full:true,placeholder:'Npr. Poročna torta'})+field('category','Kategorija','select',o.category||'Drugo',{options:options.expensecat})+field('amount','Znesek (€)','number',o.amount??0,{required:true,min:0,step:'0.01'})+field('paid','Status','checkbox',o.paid,{full:true})+field('note','Opomba','textarea',o.note,{full:true})},vendors:{label:'ponudnika',fields:o=>field('name','Ime ponudnika','text',o.name,{required:true,full:true,placeholder:'Npr. Studio Fotograf'})+field('category','Kategorija','select',o.category||'Fotograf',{options:options.vendorcat})+field('status','Status','select',o.status||'V ožjem izboru',{options:options.vendorstatus})+field('contact','Dodatni kontakt','text',o.contact,{full:true})+field('phone','Telefon','tel',o.phone)+field('email','E-pošta','email',o.email)+field('address','Naslov','text',o.address,{full:true})+field('quote','Predvidena ponudba (€)','number',o.quote??0,{min:0,step:'0.01',full:true})+field('note','Opombe','textarea',o.note,{full:true})},timeline:{label:'dogodek',fields:o=>field('time','Ura','time',o.time||'15:00',{required:true})+field('title','Dogodek','text',o.title,{required:true,full:true,placeholder:'Npr. Poročni obred'})+field('note','Podrobnosti','textarea',o.note,{full:true})}};
function openModal(type,id,categoryId){if(!forms[type])return;let item={};if(type==='categories')item=id?data.categories.find(x=>x.id===id):{};else if(type==='bookmarks'){let c=data.categories.find(x=>x.id===(categoryId||filters.categoryId));if(!c){notify('Najprej dodaj kategorijo.');return}item=id?(c.items||[]).find(x=>x.id===id):{};categoryId=c.id}else item=id?data[type].find(x=>x.id===id):{};if(id&&!item)return;modalState={type,id:id||null,categoryId:categoryId||null};document.getElementById('modalTitle').textContent=id?'Uredi '+forms[type].label:'Dodaj '+forms[type].label;document.getElementById('modalFields').innerHTML=forms[type].fields(item||{});document.getElementById('modalSubmit').textContent=id?'Shrani spremembe':'Dodaj';let dialog=document.getElementById('modal');dialog.showModal();let first=dialog.querySelector('input:not([type=checkbox])');if(first)first.focus()}
function closeModal(){document.getElementById('modal').close();modalState=null}
function deleteItem(type,id){let record=data[type]?.find(x=>x.id===id);if(!record)return;let nm=record.title||record.name||'ta vnos';if(window.confirm(`Ali res želiš izbrisati »${nm}«?`)){data[type]=data[type].filter(x=>x.id!==id);save();render();notify('Vnos je izbrisan.')}}
function exportJSON(){let b=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(b),a=document.createElement('a');a.href=url;a.download=`najindan-${new Date().toISOString().slice(0,10)}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);notify('Varnostna kopija je pripravljena.');}
function importJSON(file){if(!file)return;const reader=new FileReader();reader.onload=()=>{try{let d=JSON.parse(String(reader.result));if(!d||!d.settings||!['tasks','guests','expenses','vendors','timeline'].every(k=>Array.isArray(d[k])))throw Error('Manjkajo podatki');if(!confirm('Uvoz bo nadomestil vse trenutne podatke. Nadaljujem?'))return;if(d.photoImportVersion!==1){let oldGuests=d.guests||[],oldVendors=d.vendors||[];d.guests=[...oldGuests,...copyPhoto(PHOTO_DATA.guests).filter(x=>!oldGuests.some(y=>y.id===x.id||y.name===x.name&&y.group===x.group))];d.vendors=[...oldVendors,...copyPhoto(PHOTO_DATA.vendors).filter(x=>!oldVendors.some(y=>y.id===x.id||y.name===x.name))];d.categories=copyPhoto(PHOTO_DATA.categories);d.photoImportVersion=1}data={...blank(),...d,version:3,settings:{...blank().settings,...d.settings}};save();section='home';filters.search='';render();notify('Podatki so uspešno uvoženi.')}catch(err){alert('Datoteka ni veljavna varnostna kopija NajinDan.')}};reader.readAsText(file)}
document.addEventListener('click',e=>{let t=e.target.closest('[data-nav],[data-add],[data-edit],[data-delete],[data-close],[data-filter-tasks],[data-filter-guests],[data-paid],[data-reset],[data-export],[data-import],[data-select-category],[data-move-category],[data-delete-category],[data-delete-bookmark],[data-filter-guest-side],[data-unseat]');if(!t)return;if(t.hasAttribute('data-select-category')){filters.categoryId=t.dataset.selectCategory;filters.bookmarkSearch='';render();return}else if(t.hasAttribute('data-move-category')){moveCategory(t.dataset.moveCategory,t.dataset.dir);return}else if(t.hasAttribute('data-delete-category')){deleteCategory(t.dataset.deleteCategory);return}else if(t.hasAttribute('data-delete-bookmark')){deleteBookmark(t.dataset.categoryId,t.dataset.deleteBookmark);return}else if(t.hasAttribute('data-filter-guest-side')){filters.guestSide=t.dataset.filterGuestSide;render();return}else if(t.hasAttribute('data-unseat')){assignGuestToTable(t.dataset.unseat,'');return}if(t.hasAttribute('data-nav')){section=t.dataset.nav;filters.search='';window.scrollTo({top:0,behavior:'instant'});render()}else if(t.hasAttribute('data-add'))openModal(t.dataset.add,null,t.dataset.categoryId||filters.categoryId);else if(t.hasAttribute('data-edit'))openModal(t.dataset.edit,t.dataset.id,t.dataset.categoryId||filters.categoryId);else if(t.hasAttribute('data-delete'))deleteItem(t.dataset.delete,t.dataset.id);else if(t.hasAttribute('data-close'))closeModal();else if(t.hasAttribute('data-filter-tasks')){filters.tasks=t.dataset.filterTasks;render()}else if(t.hasAttribute('data-filter-guests')){filters.guests=t.dataset.filterGuests;render()}else if(t.hasAttribute('data-paid')){let item=data.expenses.find(x=>x.id===t.dataset.paid);if(item){item.paid=!item.paid;save();render()}}else if(t.hasAttribute('data-export'))exportJSON();else if(t.hasAttribute('data-import'))document.getElementById('importFile').click();else if(t.hasAttribute('data-reset')){if(confirm('Res želiš izbrisati VSE goste, stroške, ponudnike, dogodke in opravila? Nato se bodo obnovili zapiski iz varnostne kopije. Tega ni mogoče razveljaviti.')){data=blank();save();section='home';render();notify('Načrtovalnik je ponastavljen.')}}});
document.addEventListener('change',e=>{if(e.target.matches('[data-check]')){let t=data.tasks.find(x=>x.id===e.target.dataset.check);if(t){t.done=e.target.checked;save();render()}}else if(e.target.matches('[data-seat-assign]')){assignGuestToTable(e.target.dataset.seatAssign,e.target.value)}});
document.addEventListener('input',e=>{if(e.target.matches('[data-search]')){filters.search=e.target.value;render(true)}else if(e.target.matches('[data-bookmark-search]')){filters.bookmarkSearch=e.target.value;let p=e.target.selectionStart;render();let el=document.querySelector('[data-bookmark-search]');if(el){el.focus();el.setSelectionRange(p,p)}}});
document.getElementById('modalForm').addEventListener('submit',e=>{e.preventDefault();if(!modalState)return;let {type,id,categoryId}=modalState;let fd=new FormData(e.currentTarget);const fields=Object.fromEntries(fd.entries());if(type==='categories'){fields.name=String(fields.name||'').trim();if(!fields.name)return;if(id){let c=data.categories.find(x=>x.id===id);if(c)Object.assign(c,fields)}else{let catId=uid();data.categories.push({id:catId,...fields,items:[]});filters.categoryId=catId}save();closeModal();render();notify('Kategorija je shranjena.');return}if(type==='bookmarks'){let c=data.categories.find(x=>x.id===categoryId);if(!c)return;fields.review=fd.has('review');fields.title=String(fields.title||'').trim();if(!fields.title)return;c.items=Array.isArray(c.items)?c.items:[];if(id){let row=c.items.find(x=>x.id===id);if(row){Object.assign(row,fields);let v=data.vendors.find(v=>v.id==='vendor-'+row.id);if(v){Object.assign(v,{name:row.title,phone:row.phone||'',email:row.email||'',address:row.address||'',contact:[row.phone,row.email].filter(Boolean).join(' · '),quote:Math.max(0,Number(row.price)||0),note:row.details||''})}}}else c.items.push({id:uid(),...fields});save();closeModal();render();notify('Zapis je shranjen.');return}if(type==='seatingTables'){fields.name=String(fields.name||'').trim();if(!fields.name)return;fields.capacity=Math.max(1,Math.floor(Number(fields.capacity)||8));fields.note=String(fields.note||'');if(id){let idx=data[type].findIndex(x=>x.id===id);if(idx>=0){data[type][idx]={...data[type][idx],...fields,guestIds:Array.isArray(data[type][idx].guestIds)?data[type][idx].guestIds:[]}}}else data[type].push({id:uid(),guestIds:[],...fields});save();closeModal();render();notify('Miza je shranjena.');return}if(type==='tasks'){fields.done=id?Boolean(data.tasks.find(x=>x.id===id)?.done):false}else if(type==='guests'){fields.count=Math.max(0,Math.floor(Number(fields.count)||0))}else if(type==='expenses'){fields.amount=Math.max(0,Number(fields.amount)||0);fields.paid=fd.has('paid')}else if(type==='vendors'){fields.quote=Math.max(0,Number(fields.quote)||0)}if(id){let idx=data[type].findIndex(x=>x.id===id);if(idx>=0){data[type][idx]={...data[type][idx],...fields};if(type==='vendors'&&id.startsWith('vendor-')){let bid=id.slice(7);for(let c of data.categories){let b=c.items?.find(x=>x.id===bid);if(b){Object.assign(b,{title:fields.name,details:fields.note,phone:fields.phone,email:fields.email,address:fields.address,price:fields.quote?String(fields.quote):''});break}}}}}else data[type].push({id:uid(),...fields});save();closeModal();render();notify('Uspešno shranjeno.');});
document.addEventListener('submit',e=>{if(e.target.id!=='settingsForm')return;e.preventDefault();let fd=new FormData(e.target);data.settings.names=(fd.get('names')||'Najina poroka').toString().trim()||'Najina poroka';data.settings.date=String(fd.get('date')||'');data.settings.place=String(fd.get('place')||'').trim();data.settings.budget=Math.max(0,Number(fd.get('budget'))||0);save();render();notify('Podatki o poroki so shranjeni.')});
document.getElementById('importFile').addEventListener('change',e=>{importJSON(e.target.files?.[0]);e.target.value=''});
document.getElementById('modal').addEventListener('click',e=>{if(e.target===e.currentTarget)closeModal()});
render();
})();
</script>
